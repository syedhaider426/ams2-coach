<!doctype html>
<html lang="en" data-static="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMS2 Event</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #16181d; --muted: #5d6573; --line: #e2e5ea; --chip: #eef1f5; --grid: #eceef2;
  --a: #2563eb; --good: #1f9d55; --bad: #d64545; --warn: #b7791f; --heat: 214, 69, 69; --best: 31, 157, 85;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --panel: #171a21; --ink: #e8eaee; --muted: #9aa3b2; --line: #262b35; --chip: #222733; --grid: #20242d;
    --a: #6ea8ff; --good: #3ecf7a; --bad: #ff6b6b; --warn: #f2c14e; --heat: 255, 107, 107; --best: 62, 207, 122;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --panel: #171a21; --ink: #e8eaee; --muted: #9aa3b2; --line: #262b35; --chip: #222733; --grid: #20242d;
  --a: #6ea8ff; --good: #3ecf7a; --bad: #ff6b6b; --warn: #f2c14e; --heat: 255, 107, 107; --best: 62, 207, 122;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 22px; margin: 0; } h2 { font-size: 16px; margin: 0 0 12px; }
a { color: var(--a); text-decoration: none; } a:hover { text-decoration: underline; }
.sub { color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-top: 16px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; border-bottom: 1px solid var(--line); }
.tab { font: inherit; color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; }
.tab.on { color: var(--ink); border-bottom-color: var(--a); font-weight: 600; }
.tab .n { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 4px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-top: 14px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.tile .k { color: var(--muted); font-size: 12px; } .tile .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th.l, td.l { text-align: left; } th { color: var(--muted); font-weight: 500; font-size: 12px; }
tr.inv td { opacity: 0.55; } tr.bestrow td:first-child { box-shadow: inset 3px 0 0 var(--good); }
td.heat { min-width: 58px; }
.cgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 860px) { .cgrid { grid-template-columns: minmax(0, 1fr); } }
.cgrid .panel { margin-top: 0; }
.item { padding: 8px 0; border-top: 1px solid var(--line); } .item:first-of-type { border-top: 0; } .item b { display: block; }
.tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--chip); color: var(--muted); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
svg text { fill: var(--muted); font-size: 11px; }
.good { color: var(--good); } .bad { color: var(--bad); }
.note { color: var(--muted); font-size: 12px; margin-top: 8px; }
.traits { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px 20px; }
.trait b { font-weight: 600; }
.dots { display: inline-flex; gap: 3px; vertical-align: -1px; margin-right: 6px; }
.dots i { width: 14px; height: 8px; border-radius: 2px; background: var(--line); }
.dots i.on { background: var(--a); }
</style>
</head>
<body>
<main>
  <div class="sub"><a href="/" id="home">← All sessions</a></div>
  <h1 id="title">Loading event…</h1>
  <div class="sub" id="subtitle"></div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</main>
<script>
// Same pages run from the local server or as a published static site (the export sets data-static="1").
const STATIC = document.documentElement.dataset.static === "1";
const R = {
  sessions: () => STATIC ? "data/sessions.json" : "/api/sessions",
  eventData: id => STATIC ? "data/events/" + encodeURIComponent(id) + ".json" : "/api/event/" + encodeURIComponent(id),
  event: id => STATIC ? "event.html?id=" + encodeURIComponent(id) : "/event/" + encodeURIComponent(id),
  report: base => STATIC ? "reports/" + encodeURIComponent(base) + ".html" : "/report/" + encodeURIComponent(base),
  home: () => STATIC ? "index.html" : "/",
};
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pretty = s => String(s || '').replace(/_/g, ' ').trim();
const fmt = t => { if (!(t > 0)) return '-'; const m = Math.floor(t / 60); return m + ':' + (t - m * 60).toFixed(3).padStart(6, '0'); };
const nf = (v, d = 0) => (v === null || v === undefined || !Number.isFinite(+v)) ? '-' : (+v).toFixed(d);
const day = d => d ? new Date(d).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
const SC = ['--s1', '--s2', '--s3', '--s4', '--s5'];

let E = null, tab = 'overview';

async function load() {
  const id = STATIC ? new URLSearchParams(location.search).get('id') : decodeURIComponent(location.pathname.split('/').pop());
  const r = await fetch(R.eventData(id));
  E = await r.json();
  if (E.error) { $('title').textContent = E.error; return; }
  // Name sessions "Practice", "Qualifying", "Race 2"...
  const seen = {};
  E.sessions.forEach((s, i) => { seen[s.type] = (seen[s.type] || 0) + 1; s.color = SC[i % SC.length]; });
  const count = {};
  E.sessions.forEach(s => { count[s.type] = (count[s.type] || 0) + 1; s.name = seen[s.type] > 1 ? `${s.type} ${count[s.type]}` : s.type; });
  const ev = E.event;
  $('title').textContent = `${pretty(ev.track)}${ev.variation && ev.variation !== ev.track ? ' · ' + pretty(ev.variation.replace(ev.track + '_', '')) : ''}`;
  $('subtitle').textContent = `${ev.car} · ${day(ev.date)} · ${E.sessions.length} session${E.sessions.length === 1 ? '' : 's'}` +
    (ev.hiddenRestarts ? ` (+${ev.hiddenRestarts} restart${ev.hiddenRestarts === 1 ? '' : 's'} without a full lap, not shown)` : '');
  document.title = `${pretty(ev.track)} event`;
  render();
}

function render() {
  $('tabs').innerHTML = `<button class="tab${tab === 'overview' ? ' on' : ''}" data-t="overview">Overview</button>` +
    E.sessions.map((s, i) => `<button class="tab${tab === String(i) ? ' on' : ''}" data-t="${i}"><span class="dot" style="background:var(${s.color})"></span>${esc(s.name)}<span class="n">${s.error ? 'no full lap' : s.summary.lapsComplete + ' laps'}</span></button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
  if (tab === 'overview') overview(); else sessionView(E.sessions[+tab]);
}

// ---------- overview ----------
function overview() {
  const ok = E.sessions.filter(s => !s.error);
  const best = ok.reduce((b, s) => (!b || s.summary.bestLap.time < b.summary.bestLap.time ? s : b), null);
  const laps = ok.reduce((n, s) => n + s.summary.lapsComplete, 0);
  $('view').innerHTML = `<div class="tiles">
      <div class="tile"><div class="k">Event best</div><div class="v">${best ? fmt(best.summary.bestLap.time) : '-'}</div><div class="k">${best ? esc(best.name) : 'no complete laps'}</div></div>
      <div class="tile"><div class="k">Complete laps</div><div class="v">${laps}</div><div class="k">across ${E.sessions.length} sessions</div></div>
      <div class="tile"><div class="k">Theoretical best</div><div class="v">${best ? fmt(best.summary.theoreticalBest.time) : '-'}</div><div class="k">${best ? 'best sections of ' + esc(best.name) : ''}</div></div>
      <div class="tile"><div class="k">Consistency</div><div class="v">${best ? '±' + best.summary.consistency.stdev.toFixed(2) + ' s' : '-'}</div><div class="k">lap time spread, ${best ? esc(best.name) : ''}</div></div>
    </div>
    ${best && best.summary.carProfile ? profileCard(best.summary.carProfile) : ''}
    <div class="panel"><h2>Every lap of the event</h2>
      <div class="legend">${E.sessions.map(s => `<span><span class="dot" style="background:var(${s.color})"></span>${esc(s.name)}</span>`).join('')}<span>○ = invalid lap</span></div>
      <svg id="allLaps" style="width:100%;display:block"></svg>
      <div class="note">Laps much slower than your best (spins, pit stops, the race start) are pinned to the top of the chart.</div>
    </div>
    <div class="panel"><h2>Session comparison</h2><div class="tablewrap"><table>
      <tr><th class="l">Session</th><th>Laps</th><th>Best</th><th>Typical</th><th>Consistency</th><th>Full throttle</th><th>Coasting</th><th>Braking</th><th>ABS</th><th class="l"></th></tr>
      ${E.sessions.map((s, i) => s.error
        ? `<tr><td class="l"><span class="dot" style="background:var(${s.color})"></span>${esc(s.name)}</td><td colspan="8" class="l sub">${esc(s.error)}</td><td></td></tr>`
        : (() => { const S = s.summary, b = S.laps.find(l => l.num === S.bestLap.num).stats; return `<tr><td class="l"><span class="dot" style="background:var(${s.color})"></span><a href="#" data-i="${i}">${esc(s.name)}</a></td><td>${S.lapsComplete}</td><td><b>${fmt(S.bestLap.time)}</b></td><td>${fmt(S.medianLap.time)}</td><td>±${S.consistency.stdev.toFixed(2)} s</td><td>${b.fullThrottlePct}%</td><td>${b.coastPct}%</td><td>${b.brakingPct}%</td><td>${b.absPct}%</td><td class="l"><a href="${R.report(s.base)}" target="_blank">Full report</a></td></tr>`; })()).join('')}
    </table></div><div class="note">Pedal percentages are from each session's best lap.</div></div>`;
  $('view').querySelectorAll('a[data-i]').forEach(a => a.onclick = ev => { ev.preventDefault(); tab = a.dataset.i; render(); });
  allLapsChart();
}

function allLapsChart() {
  const svg = $('allLaps'), pts = [];
  E.sessions.forEach(s => { if (!s.error) s.summary.laps.filter(l => !l.partial).forEach(l => pts.push({ s, l })); });
  const w = 1100, h = 260, pad = { l: 60, r: 12, t: 12, b: 30 };
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  if (!pts.length) { el('text', { x: w / 2, y: h / 2, 'text-anchor': 'middle' }, svg).textContent = 'No complete laps in this event yet'; return; }
  const best = Math.min(...pts.map(p => p.l.time)), cap = best * 1.12;
  const lo = best - 0.5, hi = Math.min(cap, Math.max(...pts.map(p => p.l.time))) + 0.3;
  const X = i => pts.length === 1 ? w / 2 : pad.l + i * (w - pad.l - pad.r) / (pts.length - 1);
  const Y = v => pad.t + (1 - (Math.min(v, hi) - lo) / (hi - lo)) * (h - pad.t - pad.b);
  [lo + 0.5, (lo + hi) / 2, hi].forEach(v => { el('line', { x1: pad.l, x2: w - pad.r, y1: Y(v), y2: Y(v), stroke: css('--grid') }, svg); el('text', { x: pad.l - 6, y: Y(v) + 4, 'text-anchor': 'end' }, svg).textContent = fmt(v); });
  let prev = null;
  pts.forEach((p, i) => {
    if (prev && prev !== p.s) el('line', { x1: (X(i) + X(i - 1)) / 2, x2: (X(i) + X(i - 1)) / 2, y1: pad.t, y2: h - pad.b, stroke: css('--line'), 'stroke-dasharray': '4 4' }, svg);
    prev = p.s;
  });
  E.sessions.forEach(s => {
    const mine = pts.map((p, i) => ({ p, i })).filter(x => x.p.s === s);
    if (mine.length > 1) el('path', { d: mine.map((x, k) => (k ? 'L' : 'M') + X(x.i) + ',' + Y(x.p.l.time)).join(''), fill: 'none', stroke: css(s.color), 'stroke-width': 2, opacity: 0.6 }, svg);
  });
  pts.forEach((p, i) => {
    const c = el('circle', { cx: X(i), cy: Y(p.l.time), r: p.l.time === best ? 6 : 4.5, fill: p.l.invalid ? css('--panel') : css(p.s.color), stroke: css(p.s.color), 'stroke-width': 2 }, svg);
    el('title', {}, c).textContent = `${p.s.name} · ${p.l.label}: ${p.l.fmt}${p.l.invalid ? ' (invalid)' : ''}`;
    el('text', { x: X(i), y: h - 10, 'text-anchor': 'middle' }, svg).textContent = p.l.label.replace(/^.*lap /i, '');
  });
}

const dots = n => `<span class="dots" title="${n ? n + ' of 5' : 'not measured'}">${[1, 2, 3, 4, 5].map(i => `<i class="${n && i <= n ? 'on' : ''}"></i>`).join('')}</span>`;
function profileCard(P) {
  return `<div class="panel"><h2>About this car: ${esc(P.car)}</h2>
    <div class="sub" style="margin:-6px 0 12px">Measured from your laps. More bars = more of that trait (for "How forgiving", more bars = easier).</div>
    <div class="traits">${P.traits.map(t => `<div class="trait"><div>${dots(t.rating)}<b>${esc(t.name)}</b></div><div class="sub" style="font-size:12px">${esc(t.value)}</div><div class="sub" style="margin-top:2px">${esc(t.text)}</div></div>`).join('')}</div>
    ${P.tips.length ? `<div style="margin-top:14px"><b>How to drive it</b>${P.tips.map(t => `<div class="sub" style="margin-top:4px">• ${esc(t)}</div>`).join('')}</div>` : ''}</div>`;
}

// Best lap vs 2nd best / worst / first: where the best lap gained time and what it did differently.
function compareCards(S, s) {
  const L = S.lapCompare;
  if (!L || !L.comparisons.length) return `<div class="panel"><h2>What made your best lap faster</h2><div class="sub">Needs at least 2 clean, complete laps in this session.</div></div>`;
  const rows = (list, gained) => list.map(r => `<div class="item"><b>${r.corner} <span class="${gained ? 'good' : 'bad'}">${gained ? 'gained' : 'lost'} ${Math.abs(r.gain).toFixed(2)} s</span></b><span class="sub">${esc(r.why.length ? r.why.join(', ') : 'small differences spread through the corner')}</span></div>`).join('');
  return `<div class="panel"><h2>What made your best lap faster</h2><div class="sub">Best lap ${esc(L.best.label || '')} (${fmt(L.best.time)}) compared corner by corner.${S.assisted ? ' Braking assist was on, so braking and throttle differences are left out.' : ''} <a href="${R.report(s.base)}" target="_blank">See it on the charts</a></div>
    <div class="cgrid" style="margin-top:12px">${L.comparisons.map(c => `<div><b>Best vs ${esc(c.title)}</b> <span class="sub">(${esc(c.label)}, ${c.delta.toFixed(3)} s slower)</span>
      ${c.gained.length ? `<div class="sub" style="font-size:12px;margin-top:6px">Where your best lap gained time</div>${rows(c.gained, true)}` : ''}
      ${c.lost.length ? `<div class="sub" style="font-size:12px;margin-top:6px">Where the ${esc(c.title)} did better</div>${rows(c.lost, false)}` : ''}</div>`).join('')}</div></div>`;
}

// ---------- one session ----------
function sessionView(s) {
  if (s.error) {
    $('view').innerHTML = `<div class="panel"><h2>${esc(s.name)}</h2><div class="sub">${esc(s.error)} This usually means the session was restarted or quit before the first lap finished.</div></div>`;
    return;
  }
  const S = s.summary, C = S.coaching;
  const corners = S.corners.filter(c => !c.noData).map(c => c.name);
  const laps = S.laps;
  // best section time per corner (complete and partial laps)
  const bestSeg = {};
  corners.forEach(n => { bestSeg[n] = Math.min(...laps.map(l => s.corners[l.num] && s.corners[l.num][n] ? s.corners[l.num][n].segTime : Infinity)); });
  const maxD = {};
  corners.forEach(n => { maxD[n] = Math.max(0.05, ...laps.map(l => { const m = s.corners[l.num] && s.corners[l.num][n]; return m && m.segTime < bestSeg[n] * 1.15 ? m.segTime - bestSeg[n] : 0; })); });
  const heat = (n, m) => {
    if (!m) return '<td class="heat sub">-</td>';
    const d = m.segTime - bestSeg[n];
    if (d < 0.005) return `<td class="heat" style="background:rgba(var(--best),.22)" title="Best ${n}: ${m.segTime.toFixed(2)} s, min ${nf(m.minSpeed)} km/h">best</td>`;
    const a = Math.min(1, d / maxD[n]);
    return `<td class="heat" style="background:rgba(var(--heat),${(0.08 + a * 0.5).toFixed(2)})" title="${n}: ${m.segTime.toFixed(2)} s, min ${nf(m.minSpeed)} km/h, coast ${nf(m.coastMeters)} m">+${d.toFixed(2)}</td>`;
  };
  const bestT = S.bestLap.time;
  const rows = laps.map(l => {
    const st = l.stats, cs = s.corners[l.num] || {};
    const cls = (l.invalid ? 'inv ' : '') + (l.num === S.bestLap.num ? 'bestrow' : '');
    return `<tr class="${cls}"><td class="l"><b>${esc(l.label)}</b>${l.invalid ? ' <span class="tag">invalid</span>' : ''}${l.partial ? ' <span class="tag">partial</span>' : ''}${l.standing ? ' <span class="tag">standing start</span>' : ''}</td>` +
      `<td>${l.partial ? '<span class="sub">' + esc(l.fmt) + '</span>' : '<b>' + l.fmt + '</b>'}</td><td>${l.partial ? '' : (l.time - bestT < 0.0005 ? '<span class="good">best</span>' : '+' + (l.time - bestT).toFixed(3))}</td>` +
      `<td>${st ? st.fullThrottlePct + '%' : '-'}</td><td>${st ? st.coastPct + '%' : '-'}</td><td>${st ? st.brakingPct + '%' : '-'}</td><td>${st ? st.absPct + '%' : '-'}</td>` +
      `<td>${st ? nf(st.topSpeed) : '-'}</td><td>${st ? st.lockMeters : '-'}</td><td>${st ? st.spinMeters : '-'}</td>` +
      corners.map(n => heat(n, cs[n])).join('') + '</tr>';
  }).join('');
  const items = (list, body) => (list || []).map(x => `<div class="item"><b>${esc(x.title)}</b><span class="sub">${esc(body(x))}</span>${x.target ? `<div><span class="tag" style="margin-top:4px">Target: ${esc(x.target)}</span></div>` : ''}</div>`).join('') || '<div class="sub">Nothing flagged.</div>';
  const card = (color, title, inner) => `<div class="panel"><h2><span class="dot" style="background:var(${color})"></span>${title}</h2>${inner}</div>`;
  $('view').innerHTML = `<div class="tiles">
      <div class="tile"><div class="k">Best lap</div><div class="v">${fmt(bestT)}</div><div class="k">${esc(S.bestLap.label)}${S.bestLap.standing ? ' · standing start' : ''}</div></div>
      <div class="tile"><div class="k">Typical lap</div><div class="v">${fmt(S.medianLap.time)}</div><div class="k">median of clean laps</div></div>
      <div class="tile"><div class="k">Theoretical best</div><div class="v">${fmt(S.theoreticalBest.time)}</div><div class="k">${S.theoreticalBest.gain.toFixed(2)} s available</div></div>
      <div class="tile"><div class="k">Consistency</div><div class="v">±${S.consistency.stdev.toFixed(2)} s</div><div class="k">${S.lapsComplete} complete laps${S.lapsPartial ? ', ' + S.lapsPartial + ' partial' : ''}</div></div>
    </div>
    <div class="panel"><h2>Lap by lap</h2>
      <div class="tablewrap"><table>
        <tr><th class="l">Lap</th><th>Time</th><th>Gap</th><th>Full thr</th><th>Coast</th><th>Brake</th><th>ABS</th><th>Top km/h</th><th>Lock m</th><th>Spin m</th>${corners.map(n => `<th title="Section time vs your best pass through ${n}">${n}</th>`).join('')}</tr>
        ${rows}
      </table></div>
      <div class="note">Corner columns show how much slower each lap was through that section than your best pass (green = your best). Hover a cell for section time, minimum speed and coasting. Dimmed rows are invalid laps. <a href="${R.report(s.base)}" target="_blank">Open the full report</a> for traces, the track map and the corner table.</div>
    </div>
    ${compareCards(S, s)}
    <div class="cgrid" style="margin-top:16px">
      ${card('--good', 'What you did well', items(C.pros, x => x.detail))}
      ${card('--bad', 'Where you lost time', items(C.cons, x => x.detail))}
      ${card('--a', 'Practise next', items(C.improve, x => x.how))}
      ${card('--warn', 'Stop doing', items(C.stopDoing, x => x.detail))}
    </div>`;
}

$("home").href = R.home();
load().catch(e => { $('title').textContent = 'Could not load event: ' + e.message; });
</script>
</body>
</html>
